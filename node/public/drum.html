<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฝึกตีกลอง</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
:root {
  --primary-color: #d63384;
  --bg-gradient: linear-gradient(135deg, #fff5f8 0%, #fce4ec 100%);
}

body {
  background: var(--bg-gradient);
  font-family: 'Sarabun', -apple-system, sans-serif;
  min-height: 100vh;
  padding-bottom: 2rem;
}

/* ==========================================
   1. ส่วนหัวและส่วนประกอบ UI ทั่วไป
   ========================================== */
.top-header-bar {
  background: #ffffff;
  border-radius: 0 0 20px 20px;
  box-shadow: 0 4px 15px rgba(214, 51, 132, 0.12);
  border-bottom: 3px solid var(--primary-color);
}

.header-logo {
  width: 50px;
  height: 50px;
  object-fit: contain;
}

.card-custom {
  border: none;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
}

.profile-header {
  background: white;
  border-radius: 20px;
  padding: 16px;
  box-shadow: 0 4px 15px rgba(214, 51, 132, 0.1);
}

.rubric-cell {
  cursor: pointer;
  transition: all 0.2s ease-in-out;
  user-select: none;
}

.rubric-cell:hover:not(.locked) {
  opacity: 0.85;
  transform: scale(1.02);
}

.rubric-cell.locked {
  cursor: not-allowed;
}

.selected-1 { background-color: #dc3545 !important; color: white !important; font-weight: bold; }
.selected-2 { background-color: #ffc107 !important; color: #212529 !important; font-weight: bold; }
.selected-3 { background-color: #198754 !important; color: white !important; font-weight: bold; }
.selected-4 { background-color: #0d6efd !important; color: white !important; font-weight: bold; }

/* ==========================================
   2. โครงสร้างเวทีและองค์ประกอบกลอง
   ========================================== */
.drum-stage-container {
  width: 100%;
  position: relative;
  overflow: hidden;
  border: 3px solid #343a40;
  border-radius: 16px;
  margin: 0 auto;
  user-select: none;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

.drum-stage-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #2c3036 0%, #111315 100%);
  opacity: 0.9;
}

.drum-piece-item {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.08s ease;
  z-index: 2;
}

.drum-piece-item .drum-img {
  width: 100%;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6));
  pointer-events: none;
}

.drum-tag {
  font-size: 0.7rem;
  font-weight: bold;
  padding: 2px 8px;
  border-radius: 12px;
  margin-top: 2px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
  pointer-events: none;
}

.drum-tag kbd {
  background: rgba(0, 0, 0, 0.3);
  color: #fff;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 0.65rem;
}

/* เอฟเฟกต์การกด/ตีกลอง */
.drum-piece-item.hit-active {
  transform: scale(1.08) !important;
  opacity: 0.85 !important;
}

.drum-piece-item.hit-active .drum-tag {
  background-color: #ffeb3b !important;
  color: #000000 !important;
}

.drum-piece-item.hit-red-circle::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 40%;
  height: 40%;
  transform: translate(-50%, -50%);
  border: 4px solid #ff0000;
  background-color: rgba(255, 0, 0, 0.35);
  border-radius: 50%;
  pointer-events: none;
  box-shadow: 0 0 12px #ff0000;
  z-index: 50;
}

.position-relative.bg-dark.rounded-4 {
  height: auto !important; /* ปลดล็อกความสูง 320px ออก */
  max-width: 100%;
}

@media screen and (orientation: portrait) {
  /* 🔴 คุมขนาดกรอบกล่อง Canvas ไม่ให้สูงจนดันหน้าจอลงล่าง */
  .position-relative.bg-dark.rounded-4 {
    max-height: 360px !important; /* กำหนดความสูงสูงสุดไม่เกิน 260px */
    width: 100% !important;
    overflow: hidden;
  }

  #drumCompositeCanvas {
    width: 100% !important;
    height: 100% !important;
    aspect-ratio: 16 / 9 !important; /* ล็อคสัดส่วนแนวนอนเพื่อให้ความกว้างแสดงโน้ตครบ */
    object-fit: contain;
  }
}

/* ==========================================
   3. การจัดตำแหน่งกลองแยกตามทิศทางจอ (Media Queries)
   ========================================== */

/* 📱 จอมือถือแนวตั้ง (Portrait) */
@media screen and (orientation: portrait) {
  .drum-stage-container {
    max-width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
  }

  .drum-tag {
    font-size: 0.55rem;
    padding: 1px 5px;
  }

  .pos-kick       { top: 50%; left: 60%; width: 38%; z-index: 1; }
  .pos-tom1       { top: 20%; left: 28%; width: 25%; z-index: 2; }
  .pos-tom2       { top: 20%; left: 52%; width: 25%; z-index: 2; }
  .pos-tom3       { top: 18%; left: 75%; width: 25%; z-index: 4; }
  .pos-hihat      { top: 20%; left: 1%;  width: 28%; z-index: 3; }
  .pos-closehihat { top: 58%; left: 1%;  width: 28%; z-index: 4; }
  .pos-crash      { top: -4%;  left: 16%; width: 24%; z-index: 3; }
  .pos-cymbal     { top: -4%;  left: 65%; width: 23%; z-index: 3; }
  .pos-snare      { top: 52%; left: 28%; width: 35%; z-index: 5; }
}

/* 📱 สลับตำแหน่งเมื่อเปิดในแนวตั้ง (Portrait) */
@media screen and (orientation: portrait) {
  .drum-stage-container.is-left-handed .pos-kick       { left: auto; right: 60%; }
  .drum-stage-container.is-left-handed .pos-tom1       { left: auto; right: 28%; }
  .drum-stage-container.is-left-handed .pos-tom2       { left: auto; right: 52%; }
  .drum-stage-container.is-left-handed .pos-tom3       { left: auto; right: 75%; }
  .drum-stage-container.is-left-handed .pos-hihat      { left: auto; right: 1%;  }
  .drum-stage-container.is-left-handed .pos-closehihat { left: auto; right: 1%;  }
  .drum-stage-container.is-left-handed .pos-crash      { left: auto; right: 40%; }
  .drum-stage-container.is-left-handed .pos-cymbal     { left: auto; right: 65%; }
  .drum-stage-container.is-left-handed .pos-snare      { left: auto; right: 28%; }
}

/* 📲 จอมือถือแนวนอน / หน้าจอคอมพิวเตอร์ (Landscape) */
@media screen and (orientation: landscape) {
  .drum-stage-container {
    max-width: 620px;
    height: 350px;
  }

  .pos-kick       { top: 50%; left: 39%; width: 28%; z-index: 1; }
  .pos-tom1       { top: 16%; left: 35%; width: 18%; z-index: 2; }
  .pos-tom2       { top: 16%; left: 53%; width: 18%; z-index: 2; }
  .pos-tom3       { top: 39%; left: 63%; width: 22%; z-index: 4; }
  .pos-hihat      { top: 21%; left: 8%;  width: 20%; z-index: 3; }
  .pos-closehihat { top: 50%; left: 4%;  width: 20%; z-index: 4; }
  .pos-crash      { top: -3%; left: 19%; width: 22%; z-index: 3; }
  .pos-cymbal     { top: 9%;  left: 69%; width: 22%; z-index: 3; }
  .pos-snare      { top: 40%; left: 23%; width: 22%; z-index: 5; }
}

/* 📲 สลับตำแหน่งเมื่อเปิดในแนวนอน / จอคอมพิวเตอร์ (Landscape) */
@media screen and (orientation: landscape) {
  .drum-stage-container.is-left-handed .pos-kick       { left: auto; right: 39%; }
  .drum-stage-container.is-left-handed .pos-tom1       { left: auto; right: 35%; }
  .drum-stage-container.is-left-handed .pos-tom2       { left: auto; right: 53%; }
  .drum-stage-container.is-left-handed .pos-tom3       { left: auto; right: 63%; }
  .drum-stage-container.is-left-handed .pos-hihat      { left: auto; right: 8%;  }
  .drum-stage-container.is-left-handed .pos-closehihat { left: auto; right: 4%;  }
  .drum-stage-container.is-left-handed .pos-crash      { left: auto; right: 19%; }
  .drum-stage-container.is-left-handed .pos-cymbal     { left: auto; right: 69%; }
  .drum-stage-container.is-left-handed .pos-snare      { left: auto; right: 23%; }
}
  </style>
</head>
<body>

<!-- 🟢 DRUM MODULE VIEW (รวมหน้าบันทึกและประเมินการตีกลองไว้ใน Container เดียวกัน) -->
<div id="drumView" class="container" style="display: none; max-width: 650px;">


  <!-- 🟢 3. ส่วนแสดงผลและอัดวิดีโอกลองแบบ Canvas Composite (ย้ายเข้ามาอยู่ด้านใน drumView แล้ว) -->
  <div id="drumInteractiveSection" class="card card-custom p-0 bg-transparent">
    <h6 class="fw-bold text-dark mb-2">
      <i class="fa-solid fa-drum text-warning me-2"></i>ระบบบันทึกภาพกล้อง + แป้นกลองจำลอง
    </h6>
    <p class="text-muted small mb-2">แตะแป้นกลองบนหน้าจอ</p>
    <div id="drumAudioStatus" class="small text-muted mb-2" role="status" aria-live="polite">กำลังโหลดเสียงกลอง...</div>

    <!-- Canvas แสดงผลภาพกล้องซ้อนแป้นกลองสด -->
    <div class="position-relative bg-dark rounded-4 overflow-hidden mx-auto mb-3 shadow-sm" style="max-width: 100%; height: 320px;">
      <canvas id="drumCompositeCanvas" width="640" height="360" class="w-100 h-100" style="object-fit: contain;"></canvas>
      <div id="drumRecordingStatus" class="position-absolute top-0 start-0 m-2 badge bg-danger d-none">
        <i class="fa-solid fa-circle me-1 fa-beat"></i>กำลังบันทึกภาพและเสียง...
      </div>
    </div>

    <!-- แท็ก Video ซ่อนสำหรับดึง Stream กล้อง -->
    <video id="drumRawWebcam" autoplay playsinline muted class="d-none"></video>
<!-- 🟢 เวทีจัดวางชิ้นส่วนกลองแบบแยกชิ้นอิสระ (Modular Drum Stage) -->
<div id="drumKitStage" class="drum-stage-container mx-auto mb-3 shadow-lg rounded-4 position-relative overflow-hidden bg-dark">
  
  <div class="drum-stage-bg"></div>

  <!-- 1. Open Hi-Hat (เปิดไฮแฮท - คีย์ A) -->
  <div id="piece-hihat" class="drum-piece-item pos-hihat">
    <img src="images/open-hi-hat.png" alt="Open Hi-Hat" class="drum-img">
  </div>

  <!-- 2. Close Hi-Hat (ปิดไฮแฮท - คีย์ Z) 🟢 เพิ่มใหม่ -->
  <div id="piece-closehihat" class="drum-piece-item pos-closehihat">
    <img src="images/close-hi-hat.png" alt="Close Hi-Hat" class="drum-img">
  </div>

  <!-- 3. Tom 1 (ทอม 1 - คีย์ F) -->
  <div id="piece-tom1" class="drum-piece-item pos-tom1">
    <img src="images/tom1.png" alt="Tom 1" class="drum-img">
  </div>

  <!-- 4. Tom 2 (ทอม 2 - คีย์ J) -->
  <div id="piece-tom2" class="drum-piece-item pos-tom2">
    <img src="images/tom2.png" alt="Tom 2" class="drum-img">
  </div>

  <!-- 5. Tom 3 / Floor Tom (ทอมใหญ่ - คีย์ L) 🟢 เพิ่มใหม่ -->
  <div id="piece-tom3" class="drum-piece-item pos-tom3">
    <img src="images/tom3.png" alt="Tom 3" class="drum-img">
  </div>

  <!-- 6. Crash Cymbal (แฉฉาบแครช - คีย์ I) 🟢 เพิ่มใหม่ -->
  <div id="piece-crash" class="drum-piece-item pos-crash">
    <img src="images/crash.png" alt="Crash" class="drum-img">
  </div>

  <!-- 7. Ride Cymbal (แฉฉาบไรด์ - คีย์ K) -->
  <div id="piece-cymbal" class="drum-piece-item pos-cymbal">
    <img src="images/ride.png" alt="Ride" class="drum-img">
  </div>

  <!-- 8. Snare (สแนร์ - คีย์ S) -->
  <div id="piece-snare" class="drum-piece-item pos-snare">
    <img src="images/snare.png" alt="Snare" class="drum-img">
  </div>

  <!-- 9. Kick / Bass Drum (กระเดื่อง - คีย์ D) -->
  <div id="piece-kick" class="drum-piece-item pos-kick">
    <img src="images/kick.png" alt="Kick" class="drum-img">
  </div>

</div>
  <div class="text-center mb-2">
    <button id="btnToggleLayout" class="btn btn-outline-dark btn-sm rounded-pill px-3 fw-bold" onclick="toggleDrumLayout()">
      🔄 สลับตำแหน่งกลอง (มือซ้าย / มือขวา)
    </button>
  </div>
    <!-- ปุ่มเปิดกล้องและเริ่มอัด -->
    <div class="d-flex justify-content-center gap-2 w-100">
      <button id="btnDrumStartCam" onclick="startDrumCompositeCamera()" class="btn btn-warning text-dark fw-bold py-2 px-4 w-100">
        <i class="fa-solid fa-camera me-1"></i>เปิดกล้องสดและระบบกลอง
      </button>
      <button id="btnDrumRecord" onclick="toggleDrumCompositeRecording()" class="btn btn-outline-danger fw-bold py-2 px-4 w-100 d-none">
        <i class="fa-solid fa-circle me-1"></i>เริ่มบันทึกการตีกลอง
      </button>
    </div>
  </div>

  <!-- 4. การ์ดแสดงวิดีโอที่เคยอัปโหลดไว้ -->
  <div id="drumLatestVideoCard" class="card card-custom p-3 bg-white mb-3 text-center">
    <h6 class="fw-bold text-dark mb-2"><i class="fa-solid fa-circle-play text-warning me-2"></i>วิดีโอการตีกลองประกอบการประเมิน</h6>
    <div id="drumVideoContainer" class="ratio ratio-16x9 rounded-4 overflow-hidden border border-1 border-warning border-opacity-25 shadow-sm d-none">
      <iframe id="drumVideoPlayerFrame" src="" allow="autoplay" allowfullscreen style="border: 0;"></iframe>
    </div>
    <div id="drumNoVideoAlert" class="p-3 bg-light rounded-4 text-muted small">
      <i class="fa-solid fa-video-slash me-1 text-secondary"></i>ไม่พบวิดีโอการตีกลองในระบบ
    </div>
  </div>

</div> <!-- 👈 แท็กปิด drumView อยู่นี่ครับ -->

<div id="loading" class="position-fixed top-0 start-0 w-100 h-100 align-items-center justify-content-center bg-dark bg-opacity-50" style="display: none; z-index: 2000;">
  <div class="bg-white rounded-4 p-4 text-center shadow">
    <div class="spinner-border text-warning mb-2" role="status"></div>
    <div id="loadingText">กำลังโหลด...</div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // ==========================================
    // drum
    // ==========================================
    let audioCtx = null;
    let drumSoundBuffers = {};
    let streamDestination = null; // สายสัญญาณเสียงส่งเข้าตัวบันทึกวิดีโอ
    let isCanvasLoopRunning = false;
    let activeDrumHits = {}; // 👈 ประกาศตัวแปรเก็บสถานะการตีกลองที่นี่
    let canvasStreamDestination = null;
    let drumSelectedScores = { rhythm: 0, melody: 0, expression: 0 };
    let isDrumEvalLocked = false;
    let drumChartTeacherInstance = null;
    let drumChartStudentInstance = null;
    let drumChartParentInstance = null;
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyeSwvNSfHtXULSvj_QLLYACKYfZ2Yf0T4Aqa3fFroDF3ugCxJ-1oYRItsZzkAyAqIa/exec";
    let currentUserData = {
      role: "Student",
      studentCode: "",
      fullName: "ผู้ทดสอบผ่านเว็บ",
      classRoom: ""
    };
    let currentTargetStudentCode = null;
    let masterGain = null;
    let mediaRecorder;
    let mediaStream = null;      // 👈 ตัวแปรเก็บสตรีมกล้องสด
    let isRecording = false;      // 👈 เพิ่มตัวแปรนี้เพื่อเช็กสถานะการอัดวิดีโอ
    let recordedChunks = [];

    // ==========================================
    // 🌐 CORE API & INITIALIZATION
    // ==========================================
    async function apiCall(action, payload = {}) {
      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: action, payload: payload }),
          redirect: "follow"
        });
        return await response.json();
      } catch (err) {
        console.error("API Call Error:", err);
        return { success: false, message: "ไม่สามารถติดต่อเซิร์ฟเวอร์ได้: " + err.toString() };
      }
    }

document.addEventListener("DOMContentLoaded", function() {
  const drumView = document.getElementById("drumView");
  if (drumView) drumView.style.display = "block";
  
  // 1. โหลดเสียงกลองเตรียมไว้
  preloadDrumSounds();

  // 2. ตรวจสอบและดึงรหัสนักเรียนจาก URL
  const studentCode = new URLSearchParams(window.location.search).get("studentCode");
  if (studentCode) {
    document.getElementById("drumStudentCodeInput").value = studentCode;
    loadDrumStudent();
  }

  // 3. โหลดค่าตำแหน่งกลอง (มือซ้าย/มือขวา)
  if (localStorage.getItem('drum_layout_left_handed') === 'true') {
    document.querySelector('.drum-stage-container')?.classList.add('is-left-handed');
  }
});

    document.addEventListener("pointerdown", function unlockAudio() {
      initAudioContext();
      document.removeEventListener("pointerdown", unlockAudio);
    }, { once: true });

    async function preloadDrumSounds() {
      const drumSounds = {
        hihat: "open-hi-hat.mp3",
        closehihat: "close-hi-hat.mp3",
        tom1: "tom1.mp3",
        tom2: "tom2.mp3",
        tom3: "tom3.mp3",
        crash: "crash.mp3",
        cymbal: "ride.mp3",
        snare: "snare.mp3",
        kick: "kick.mp3"
      };

      try {
        initAudioContext();
        const results = await Promise.allSettled(Object.entries(drumSounds).map(async ([type, fileName]) => {
          const response = await fetch(`audio/${fileName}`);
          if (!response.ok) {
            throw new Error(`โหลด ${fileName} ไม่สำเร็จ (${response.status})`);
          }
          const audioData = await response.arrayBuffer();
          const decodedBuffer = await audioCtx.decodeAudioData(audioData);
          drumSoundBuffers[type] = trimAudioBufferSilence(decodedBuffer);
        }));

        const failedSounds = results
          .map((result, index) => result.status === "rejected" ? Object.values(drumSounds)[index] : null)
          .filter(Boolean);
        const status = document.getElementById("drumAudioStatus");

        if (failedSounds.length) {
          console.error("Drum sound preload errors:", results.filter(result => result.status === "rejected"));
          status.textContent = `โหลดเสียงไม่สำเร็จ: ${failedSounds.join(", ")}`;
          status.className = "small text-danger mb-2";
        } else {
          status.textContent = "โหลดเสียงกลองพร้อมใช้งานแล้ว";
          status.className = "small text-success mb-2";
        }
      } catch (err) {
        console.error("Drum audio initialization error:", err);
        const status = document.getElementById("drumAudioStatus");
        status.textContent = "เริ่มระบบเสียงไม่สำเร็จ กรุณาลองรีโหลดหน้า";
        status.className = "small text-danger mb-2";
      }
    }

    async function loadDrumStudent() {
      const studentCode = document.getElementById("drumStudentCodeInput").value.trim();
      if (!studentCode) {
        Swal.fire("กรุณาใส่รหัสนักเรียน", "ใส่รหัสเพื่อโหลดหรือบันทึกผล โดยไม่ต้องเข้าสู่ระบบ", "warning");
        return;
      }

      currentTargetStudentCode = studentCode;
      currentUserData = {
        role: "Student",
        studentCode: studentCode,
        fullName: studentCode ? `นักเรียนรหัส ${studentCode}` : "ผู้ทดสอบผ่านเว็บ",
        classRoom: ""
      };
      document.getElementById("drumStudentName").textContent = currentUserData.fullName;

      isDrumEvalLocked = false;
      drumSelectedScores = { rhythm: 0, melody: 0, expression: 0 };
      document.querySelectorAll(".drum-rubric").forEach(cell => {
        cell.classList.remove("selected-1", "selected-2", "selected-3", "selected-4", "locked");
      });

      await fetchAndSetupCategoryEvaluation("ตีกลอง", studentCode, "drum");

// 🟢 ฟังก์ชันดึงข้อมูลและเรียกวาด Radar Chart ของวิชาตีกลอง
async function fetchAndSetupCategoryEvaluation(categoryName, studentCode, prefix) {
  document.getElementById("loadingText").textContent = `กำลังดึงข้อมูลการประเมิน (${categoryName})...`;
  document.getElementById("loading").style.display = "block";

  const res = await apiCall("getSingingEvaluationStatus", {
    studentCode: studentCode,
    category: categoryName,
    role: currentUserData ? currentUserData.role : 'Student'
  });

  document.getElementById("loading").style.display = "none";
  if (!res || !res.success) return;

  // 1. จัดการการแสดงผลวิดีโอ
  const videoContainer = document.getElementById(`${prefix}VideoContainer`);
  const noVideoAlert = document.getElementById(`${prefix}NoVideoAlert`);
  const videoFrame = document.getElementById(`${prefix}VideoPlayerFrame`);

  let fileId = res.latestFileId;
  if (!fileId && res.latestVideoUrl) {
    const match = res.latestVideoUrl.match(/[\/=]([a-zA-Z0-9_-]{25,})/);
    if (match) fileId = match[1];
  }

  if (fileId && videoContainer && videoFrame && noVideoAlert) {
    videoFrame.src = `https://drive.google.com/file/d/${fileId}/preview`;
    videoContainer.classList.remove("d-none");
    noVideoAlert.classList.add("d-none");
  } else if (videoContainer && noVideoAlert) {
    videoContainer.classList.add("d-none");
    noVideoAlert.classList.remove("d-none");
  }

  // 2. ปลดซ่อนกล่อง Radar Chart
  const radarSection = document.getElementById(`${prefix}RadarSection`);
  if (radarSection) {
    radarSection.classList.remove("d-none");
  }

  // 3. วาด Radar Chart สำหรับวิชาตีกลอง
  if (prefix === 'drum' && typeof initDrumRadarCharts === 'function') {
    initDrumRadarCharts(
      res.teacherScores || [0,0,0], 
      res.studentScores || [0,0,0], 
      res.parentScores || [0,0,0]
    );
  }
}

// 1. เปิดกล้องและเริ่มรัน Canvas Rendering Loop
async function startDrumCompositeCamera() {
  initAudioContext(); // เปิดระบบ Web Audio API

  try {
    const constraints = { video: { width: 200, height: 300 }, audio: true };
    mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
    
    const videoEl = document.getElementById("drumRawWebcam");
    videoEl.srcObject = mediaStream;

    // เมื่อวิดีโอกล้องพร้อม ให้เริ่มวาดลง Canvas
    videoEl.onloadedmetadata = () => {
      videoEl.play();
      isCanvasLoopRunning = true;
      requestAnimationFrame(renderDrumCanvasLoop);
    };

    // สลับปุ่ม
    document.getElementById("btnDrumStartCam").classList.add("d-none");
    document.getElementById("btnDrumRecord").classList.remove("d-none");

  } catch (err) {
    Swal.fire("ข้อผิดพลาด", "ไม่สามารถเปิดกล้องได้: " + err.message, "error");
  }
}

function initAudioContext() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass({ latencyHint: 'interactive' });
    
    // สร้าง Master Gain รวมสัญญาณเสียงออกลำโพงและตัวอัดวิดีโอ
    masterGain = audioCtx.createGain();
    masterGain.connect(audioCtx.destination);
    
    streamDestination = audioCtx.createMediaStreamDestination();
    masterGain.connect(streamDestination);
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// ฟังก์ชันเล่นเสียงกลองชนิดต่างๆ
function playDrum(type) {
  if (!audioCtx) initAudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const buffer = drumSoundBuffers[type];
  if (!buffer) return;

  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(masterGain); // เชื่อมผ่าน masterGain ที่เตรียมไว้
  source.start(audioCtx.currentTime); // สั่งเล่นทันที ณ เวลาปัจจุบัน
}

// 🟢 ฟังก์ชันวาดบรรทัด 5 เส้น + โน้ตกลองซ้อนบนวิดีโอ Canvas
// 🟢 ปรับเปลี่ยนโทนสีบรรทัด 5 เส้น และตัวโน้ตเป็นสีดำ บนพื้นหลังขาว
function renderDrumCanvasLoop() {
  if (!isCanvasLoopRunning) return;

  const canvas = document.getElementById("drumCompositeCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const videoEl = document.getElementById("drumRawWebcam");

  // 🔴 ล็อคความกว้างและความสูง Canvas ให้คงที่ 640x360 เพื่อให้โน้ตกลองวางครบทุกชิ้น
  if (canvas.width !== 640 || canvas.height !== 360) {
    canvas.width = 640;
    canvas.height = 360;
  }

  // A. วาดภาพกล้องสดเต็มหน้าจอ Canvas
// 🔴 1. เช็กสัดส่วนภาพจริงจากกล้องสด และปรับขนาด Canvas ให้ตรงตามกล้องทันที
if (videoEl && videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
    ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  
  // B. วาดป้ายชื่อนักเรียนมุมบนซ้าย
  ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
  ctx.beginPath();
  ctx.roundRect(10, 10, 240, 35, 8);
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 13px Sarabun, sans-serif";
  const studentName = currentUserData ? currentUserData.fullName : "นักเรียน";
  ctx.fillText(`👤 ${studentName}`, 20, 32);

  // C. ⚪ วาดกล่องพื้นหลังบรรทัด 5 เส้นเป็นสีขาว (rgba 90% หรือ #ffffff)
  const staffBgY = 240;
  const staffBgH = 110;
  ctx.fillStyle = "rgba(255, 255, 255, 0.92)"; // 👈 เปลี่ยนเป็นสีขาวโปร่งแสง
  ctx.beginPath();
  ctx.roundRect(10, staffBgY, canvas.width - 20, staffBgH, 12);
  ctx.fill();
  ctx.strokeStyle = "rgba(0, 0, 0, 0.2)";
  ctx.lineWidth = 1;
  ctx.stroke();

  // D. ⬛ วาดเส้นบรรทัด 5 เส้นเป็นสีดำ (Staff Lines)
  const lineSpacing = 8;
  const line5Y = staffBgY + 50; // เส้นที่ 5 (เส้นบนสุด)
  const xStart = 25;
  const xEnd = canvas.width - 25;

  ctx.strokeStyle = "#000000"; // 👈 เปลี่ยนเส้นบรรทัดเป็นสีดำ
  ctx.lineWidth = 1.2;
  for (let i = 0; i < 5; i++) {
    const y = line5Y + (i * lineSpacing);
    ctx.beginPath();
    ctx.moveTo(xStart, y);
    ctx.lineTo(xEnd, y);
    ctx.stroke();
  }

// E. ⬛ วาดกุญแจกลอง (Percussion Clef ║)
  ctx.fillStyle = "#000000";

  // 🔴 ปรับระยะขยับขึ้น/ลง (ค่าบวก = เลื่อนลง, ค่าลบ = เลื่อนขึ้น)
  const clefOffsetY = 8; // เช่น 2, 4 (เลื่อนลง) หรือ -2, -4 (เลื่อนขึ้น)

  // พิกัด Y สำหรับวาดเส้นกุญแจกลอง
  const clefY = line5Y + clefOffsetY;

  // วาดเส้นแนวตั้ง 2 เส้นคู่
  ctx.fillRect(35, clefY, 3, lineSpacing * 2); // 💡 หมายเหตุ: ใช้ lineSpacing * 4 เพื่อให้ยาวคลุมครบ 5 เส้นพอดี
  ctx.fillRect(43, clefY, 3, lineSpacing * 2);

  ctx.font = "bold 18px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("4", 58, line5Y + 14);
  ctx.fillText("4", 58, line5Y + 30);

  // F. กำหนดตำแหน่งโน้ตกลอง 8 ชิ้นตามมาตรฐาน Notation Key
  const drumNotesConfig = [
    { id: 'crash',      label: 'Crash',    x: 95,  y: line5Y - 12, shape: 'x_ledger' },
    { id: 'hihat',      label: 'Open HH',  x: 160, y: line5Y - 4,  shape: 'open_x' },
    { id: 'closehihat', label: 'Close HH', x: 220, y: line5Y - 4,  shape: 'x' },
    { id: 'cymbal',     label: 'Ride',     x: 280, y: line5Y,      shape: 'x' },
    { id: 'tom1',       label: 'Tom 1',    x: 340, y: line5Y + 4,  shape: 'head' },
    { id: 'tom2',       label: 'Tom 2',    x: 400, y: line5Y + 8, shape: 'head' },
    { id: 'snare',      label: 'Snare',    x: 460, y: line5Y + 12, shape: 'head' },
    { id: 'tom3',       label: 'Tom 3',    x: 520, y: line5Y + 20, shape: 'head' },
    { id: 'kick',       label: 'Kick',     x: 580, y: line5Y + 28, shape: 'head' }
  ];

  const now = Date.now();

  drumNotesConfig.forEach(note => {
    const isHit = activeDrumHits[note.id] && (now - activeDrumHits[note.id] < 180);

    // 🔴 เมื่อกดตีจะกระพริบเป็นสีแดงสว่าง ถ้ายังไม่กดจะเป็นสีดำ
    const mainColor = isHit ? '#ff0000' : '#000000'; // 👈 ตัวโน้ตปกติเป็นสีดำ
    const labelColor = isHit ? '#cc0000' : '#444444'; // 👈 ข้อความกำกับสีเข้มอ่านง่ายบนพื้นขาว

    // 1. วาดเส้นขีดซ้อน (Ledger line) สำหรับ Crash
    if (note.shape === 'x_ledger') {
      ctx.strokeStyle = mainColor;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(note.x - 8, note.y);
      ctx.lineTo(note.x + 8, note.y);
      ctx.stroke();
    }

// 2. วาดหัวโน้ต (Notehead) - ปรับรูปทรงวงรีและความเอียงตรงตามรูปภาพ (-0.42 Radian)
    if (note.shape === 'head') {
      ctx.fillStyle = mainColor;
      ctx.beginPath();
      // (x, y, radiusX, radiusY, rotation, startAngle, endAngle)
      ctx.ellipse(note.x, note.y, 6.5, 4.2, -0.42, 0, Math.PI * 2);
      ctx.fill();

    } else if (note.shape === 'open_x') {
      // 🔴 หัวโน้ตแบบวงกลมมีกากบาทตรงกลาง (Open Hi-Hat)
      ctx.strokeStyle = mainColor;
      ctx.lineWidth = isHit ? 3 : 2;

      // วาดตัว X (กากบาท)
      ctx.beginPath();
      ctx.moveTo(note.x - 3.5, note.y - 3.5); ctx.lineTo(note.x + 3.5, note.y + 3.5);
      ctx.moveTo(note.x + 3.5, note.y - 3.5); ctx.lineTo(note.x - 3.5, note.y + 3.5);
      ctx.stroke();

      // วาดวงกลมครอบกากบาท
      ctx.beginPath();
      ctx.arc(note.x, note.y, 5.5, 0, Math.PI * 2);
      ctx.stroke();
    
    } else {
      ctx.strokeStyle = mainColor;
      ctx.lineWidth = isHit ? 3 : 2;
      ctx.beginPath();
      ctx.moveTo(note.x - 4, note.y - 4); ctx.lineTo(note.x + 4, note.y + 4);
      ctx.moveTo(note.x + 4, note.y - 4); ctx.lineTo(note.x - 4, note.y + 4);
      ctx.stroke();
    }

// 3. วาดหางโน้ต (Stem) - ปรับทิศทางและตำแหน่งอัตโนมัติ
ctx.strokeStyle = mainColor;
    ctx.lineWidth = 1.5;
    ctx.beginPath();

    const line3Y = line5Y + 16;
    const isAboveLine3 = note.y <= line3Y;
    const stemLength = 28;

    // 🔴 กำหนดระยะ offset แนวขวาง (X) และแนวดิ่ง (Y) ของหัวโน้ตแต่ละทรง
    let offsetX = 4.0;
    let offsetY = 0.0; // ค่าปรับระยะขยับขึ้น/ลง (ค่าบวก = ขยับลง, ค่าลบ = ขยับขึ้น)

    if (note.shape === 'head') {
      offsetX = 5.5;      // หัวโน้ตวงรี (Tom, Snare, Kick)
      offsetY = 0.0;      // 👈 ปรับขยับแนวดิ่ง (+ ขยับลง / - ขยับขึ้น)
    } else if (note.shape === 'open_x') {
      offsetX = 5.5;      // หัวโน้ต Open HH
      offsetY = 0.0;
    } else if (note.shape === 'x') {
      offsetX = 4.0;      // หัวโน้ต Close HH / Ride
      offsetY = 2.5;
    } else if (note.shape === 'x_ledger') {
      offsetX = 4.0;      // หัวโน้ต Crash
      offsetY = 0.0;
    }

    // คำนวณพิกัด Y จุดเริ่มต้นของโคนหางโน้ต
    const startY = note.y + offsetY;

    if (isAboveLine3) {
      // หางชี้ลง (โคนหางอยู่ทางซ้าย)
      const stemX = note.x - offsetX;
      ctx.moveTo(stemX, startY);
      ctx.lineTo(stemX, startY + stemLength);
    } else {
      // หางชี้ขึ้น (โคนหางอยู่ทางขวา)
      const stemX = note.x + offsetX;
      ctx.moveTo(stemX, startY);
      ctx.lineTo(stemX, startY - stemLength);
    }

    ctx.stroke();

    // 4. วาดชื่อเครื่องกลองกำกับด้านบน
    ctx.fillStyle = labelColor;
    ctx.font = isHit ? "bold 11px Sarabun, sans-serif" : "10px Sarabun, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(note.label, note.x, staffBgY + 16);
  });

  requestAnimationFrame(renderDrumCanvasLoop);
}

// 🟢 ฟังก์ชันเล่นเสียง + ทำอนิเมชันขยายกระพริบบนชิ้นส่วนกลองที่ถูกเลือก

function toggleDrumCompositeRecording() {
  const btnRecord = document.getElementById("btnDrumRecord");
  const statusBadge = document.getElementById("drumRecordingStatus");

  if (!isRecording) {
    recordedChunks = [];
    const canvas = document.getElementById("drumCompositeCanvas");

    // 1. ดึงสายสัญญาณวิดีโอจาก Canvas (30 FPS)
    const canvasVideoStream = canvas.captureStream(30);
    const videoTrack = canvasVideoStream.getVideoTracks()[0];

    // 2. ดึงสายสัญญาณเสียงไมโครโฟน + เสียงกลองสด
    const micTrack = mediaStream.getAudioTracks()[0];
    const drumAudioTrack = streamDestination ? streamDestination.stream.getAudioTracks()[0] : null;

    const tracks = [videoTrack, micTrack];
    if (drumAudioTrack) tracks.push(drumAudioTrack);

    const finalStream = new MediaStream(tracks);

    try {
      mediaRecorder = new MediaRecorder(finalStream, { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 600000 });
    } catch (e) {
      mediaRecorder = new MediaRecorder(finalStream);
    }

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = saveRecordedVideo;
    mediaRecorder.start();

    isRecording = true;
    btnRecord.innerHTML = '<i class="fa-solid fa-square me-1"></i>หยุดอัดและส่งคลิปประเมิน';
    btnRecord.className = "btn btn-danger fw-bold py-2 px-4 w-100";
    if (statusBadge) statusBadge.classList.remove("d-none");

  } else {
    mediaRecorder.stop();
    isRecording = false;
    isCanvasLoopRunning = false; // หยุด Loop สตรีม Canvas
    btnRecord.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>กำลังประมวลผลวิดีโอ...';
    btnRecord.disabled = true;
    if (statusBadge) statusBadge.classList.add("d-none");
  }
}

// 🟢 ฟังก์ชันตัดความเงียบหัวไฟล์ MP3 ออกใน RAM
function trimAudioBufferSilence(buffer) {
  const channelData = buffer.getChannelData(0);
  let start = 0;
  const threshold = 0.005;

  for (let i = 0; i < channelData.length; i++) {
    if (Math.abs(channelData[i]) > threshold) {
      start = i;
      break;
    }
  }
  if (start === 0) return buffer;

  const trimmedLength = buffer.length - start;
  const trimmedBuffer = audioCtx.createBuffer(buffer.numberOfChannels, trimmedLength, buffer.sampleRate);
  for (let c = 0; c < buffer.numberOfChannels; c++) {
    trimmedBuffer.getChannelData(c).set(buffer.getChannelData(c).subarray(start));
  }
  return trimmedBuffer;
}

        stopCamera();
        resetDrumRecordingControls();

        if (res && res.success) {
          Swal.fire("สำเร็จ!", "อัปโหลดวิดีโอลง Google Drive สำเร็จ", "success").then(() => {
            fetchAndSetupCategoryEvaluation('ตีกลอง', currentTargetStudentCode, 'drum');
          });
        } else {
          Swal.fire("ข้อผิดพลาด", res ? res.message : "อัปโหลดไม่สำเร็จ", "error");
        }
      };
      reader.readAsDataURL(blob);
    }

    function resetDrumRecordingControls() {
      document.getElementById("btnDrumStartCam").classList.remove("d-none");
      document.getElementById("btnDrumRecord").classList.add("d-none");
      document.getElementById("btnDrumRecord").disabled = false;
      document.getElementById("btnDrumRecord").innerHTML = '<i class="fa-solid fa-circle me-1"></i>เริ่มบันทึกการตีกลอง';
    }

    function stopCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      isRecording = false;
    }


  </script>
</body>
</html>
