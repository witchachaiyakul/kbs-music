<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - ดนตรีสากล ม.3</title>
  
  <!-- CSS External Libraries -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Custom CSS กลาง -->
  <link rel="stylesheet" href="css/main.css?v=20261102">

  <!-- JS External Libraries -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- Top Header Bar -->
  <header class="top-header-bar p-3 mb-4 sticky-top">
    <div class="container d-flex align-items-center" style="max-width: 500px;">
      <img src="https://lh3.googleusercontent.com/d/1e0Nse_gOz3iQBuC7sIqV3FhC4Oll_8-M" 
           alt="School Logo" 
           class="header-logo me-3 rounded-circle border border-danger p-1">
      <div>
        <h6 class="fw-bold mb-0 text-dark" style="color: var(--primary-color);">ดนตรีสากล</h6>
        <div class="small text-muted fw-semibold">
          <span class="badge bg-danger bg-opacity-10 text-danger me-1">ศ23103</span>
          <span>ชั้นมัธยมศึกษาปีที่ 3</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Loading State -->
  <div id="loading" class="text-center my-5 py-5">
    <div class="spinner-border text-danger" style="width: 3rem; height: 3rem;" role="status"></div>
    <p class="mt-3 text-secondary fw-bold" id="loadingText">กำลังตรวจสอบสิทธิเข้าใช้งานผ่าน LINE...</p>
  </div>

  <!-- Registration View (แสดงเฉพาะเมื่อยังไม่เคยลงทะเบียน) -->
  <div id="registerView" class="container" style="display: none; max-width: 480px;">
    <div class="card card-custom p-4 bg-white">
      <div class="text-center mb-3">
        <img id="regUserImg" class="rounded-circle mb-2 border border-2 border-danger p-1" width="70" height="70" src="https://via.placeholder.com/70" alt="Profile Image">
        <h5 class="fw-bold text-dark">ลงทะเบียนเข้าใช้งานครั้งแรก</h5>
        <p class="text-muted small">กรุณาเลือกห้องเรียนและชื่อนักเรียนเพื่อผูกกับบัญชี LINE</p>
      </div>
      
      <form id="regForm" onsubmit="handleRegister(event)">
        <div class="mb-3">
          <label class="form-label small fw-bold">สถานะผู้ใช้งาน</label>
          <select id="regRole" class="form-select" required>
            <option value="Student">นักเรียน</option>
            <option value="Parent">ผู้ปกครอง</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">ระดับชั้น/ห้อง</label>
          <select id="regClassRoom" class="form-select" required onchange="onClassroomChange()">
            <option value="">-- กำลังโหลดห้องเรียน... --</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">ชื่อ-นามสกุล นักเรียน</label>
          <select id="regStudentSelect" class="form-select" required disabled onchange="onStudentChange()">
            <option value="">-- กรุณาเลือกห้องเรียนก่อน --</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">รหัสนักเรียน</label>
          <input type="text" id="regStudentCode" class="form-control bg-light" readonly placeholder="รหัสจะแสดงอัตโนมัติ" required>
        </div>

        <button type="submit" id="regSubmitBtn" class="btn btn-danger w-100 py-2 fw-bold" style="background-color: var(--primary-color);">ยืนยันการลงทะเบียน</button>
      </form>
    </div>
  </div>

  <!-- JS Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js?v=20261102"></script>
</body>
</html>
